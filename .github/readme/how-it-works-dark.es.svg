<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-label="Consigue la extensión (una vez por navegador).: instálala desde la Chrome Web Store. Prepara tu proyecto.: Los HTML estáticos se saltan este paso - basta servir la carpeta en localhost. Si no, npx froede init (detecta tu vite.config, instala el plugin y lo cablea solo). Arranca el companion y emparéjalo.: npx froede imprime un puerto y un token de emparejamiento. Abre tu página en localhost, pega el puerto + token en el popup de la extensión, pulsa &quot;Save and test&quot; y luego &quot;Edit&quot;. Clic para seleccionar, doble clic para editar texto.: Cada cambio se guarda en el archivo real, y Ctrl+Z lo deshace sin salir de la página."><g transform="translate(94 8) scale(2.1667)"><path fill="none" stroke="#7d70d2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="M15.39 4.39a1 1 0 0 0 1.68-.474a2.5 2.5 0 1 1 3.014 3.015a1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474a2.5 2.5 0 1 0-3.014 3.015a1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474a2.5 2.5 0 1 1-3.014-3.015a1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474a2.5 2.5 0 1 0 3.014-3.015a1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z"/></g><text x="120" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">Consigue la</text><text x="120" y="130" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">extensión (una vez</text><text x="120" y="160" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">por navegador).</tex