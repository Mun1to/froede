<svg xmlns="http://www.w3.org/2000/svg" width="520" height="695" viewBox="0 0 520 695" role="img" aria-label="Get the extension (once per browser).: install it from the Chrome Web Store. Wire up your project.: Static HTML projects skip this - just serve the folder on localhost. Otherwise run npx froede init (detects your Vite config, installs the plugin, wires it up). Start the companion and pair it.: Run npx froede (prints a port and a pairing token). Open your localhost page, paste the port + token into the extension popup, hit &quot;Save and test&quot;, then &quot;Edit&quot;. Click to select, double-click to edit text.: Every change is saved to the real file, and Ctrl+Z undoes it without leaving the page."><g transform="translate(8 8) scale(2)"><path fill="none" stroke="#7d70d2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="M15.39 4.39a1 1 0 0 0 1.68-.474a2.5 2.5 0 1 1 3.014 3.015a1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474a2.5 2.5 0 1 0-3.014 3.015a1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474a2.5 2.5 0 1 1-3.014-3.015a1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474a2.5 2.5 0 1 0 3.014-3.015a1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z"/></g><text x="80" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#f0f6fc">Get the extension (once per</text><text x="80" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#f0f6fc">browser).</text><text x="80" y="102" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#9198a1">install it from the Chrome Web</text><text x="80" y="131" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial